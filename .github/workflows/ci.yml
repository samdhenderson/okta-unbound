name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test + coverage gate
        # Runs the jsdom unit project with the coverage thresholds enforced
        # (thresholds live in vitest.config.ts — ADR-0019). Replaces the old bare
        # `test:run`.
        run: npm run test:coverage

      # Dead-code detection. Reports unused files, exports and dependencies that
      # `noUnusedLocals` and eslint's no-unused-vars structurally cannot see (both
      # are file-local; neither ever flags an unused *export*).
      #
      # NON-BLOCKING for now: the repo has a known backlog at the time this landed
      # (see docs/dead-code.md). Promote to a hard gate — drop the
      # `continue-on-error` — once that backlog reaches zero.
      - name: Dead code (knip)
        continue-on-error: true
        run: npm run knip

      # Reachability from the three manifest entry points only, with tests and
      # stories excluded from the project. This is what surfaces code that is alive
      # *only* because a test imports it — `npm run knip` cannot see that class of
      # dead code, because it treats test files as entry points.
      #
      # Advisory by design, never a gate: some exports legitimately exist as testing
      # seams. Human review decides.
      - name: Dead code — production reachability (advisory)
        continue-on-error: true
        run: npm run knip:production

      - name: Circular dependencies
        run: npm run knip:circular

      # A literal control byte in a source file makes it *binary* to grep(1), so
      # every grep-based scan — CI greps, knip, and any human or agent searching
      # the tree — silently skips it. One had been sitting in useAppsData.ts.
      # The escape sequence is fine; a raw byte is not.
      - name: No control bytes in source
        run: npm run lint:control-chars

  # Component explorer build gate (ADR-0010). Runs in parallel with `verify` (no
  # `needs:`), so it never delays the fast lint/type/test feedback. A broken or
  # mis-imported story fails the PR.
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Storybook build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/storybook
          key: storybook-${{ hashFiles('package-lock.json', '.storybook/**') }}
          restore-keys: |
            storybook-

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      # Run every story as a headless-browser render test (9 have play/assert fns).
      # VITEST_BROWSER_EXECUTABLE is intentionally unset here so Playwright uses the
      # browser installed below (the pinned-sandbox path only exists locally).
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Story browser tests
        run: npm run test:storybook
